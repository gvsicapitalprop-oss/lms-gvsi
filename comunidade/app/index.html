<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>GVSI Comunidade</title>
<script>(function(){try{var t=localStorage.getItem('gvsi-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">

<!-- Sidebar (desktop) — persiste em toda navegação -->
<aside class="hidden lg:flex lg:flex-col fixed inset-y-0 left-0 w-[360px] bg-surface border-r border-outline-variant z-40">
<a href="#/" class="h-16 flex items-center gap-sm px-lg border-b border-outline-variant shrink-0">
<span class="material-symbols-outlined text-primary fill">groups</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary">GVSI Comunidade</span>
</a>
<nav id="side-topics" class="flex-1 overflow-y-auto custom-scrollbar p-sm space-y-1"></nav>
<div class="border-t border-outline-variant p-sm flex items-center gap-sm shrink-0">
<a href="#/perfil" data-side-profile class="flex-1 flex items-center gap-sm p-sm rounded-lg hover:bg-surface-container-high transition-colors">
<span data-side-avatar class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center text-outline overflow-hidden"><span class="material-symbols-outlined text-[20px]">person</span></span>
<span data-side-name class="font-body-sm text-on-surface truncate">Meu Perfil</span>
</a>
<button type="button" data-theme-toggle class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors" aria-label="Alternar tema">
<span class="material-symbols-outlined text-[20px]" data-theme-icon>dark_mode</span>
</button>
<button type="button" data-signout class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-error/10 hover:text-error transition-colors" aria-label="Sair">
<span class="material-symbols-outlined text-[20px]">logout</span>
</button>
</div>
</aside>

<!-- Região de conteúdo — trocada pelo roteador (sem recarregar) -->
<div id="view" class="min-h-screen"></div>

<!-- Modal de confirmação -->
<div id="confirm-modal" class="hidden fixed inset-0 z-[90] items-center justify-center p-container-margin bg-black/40">
<div class="w-full max-w-xs bg-surface-container-lowest rounded-2xl shadow-xl border border-outline-variant/40 p-lg space-y-md">
<h3 id="confirm-title" class="font-headline-sm text-headline-sm text-on-surface">Confirmar?</h3>
<p id="confirm-text" class="text-body-sm text-on-surface-variant"></p>
<div class="flex gap-sm justify-end pt-sm">
<button type="button" id="confirm-cancel" class="h-10 px-4 rounded-full text-on-surface font-label-md hover:bg-surface-container-high transition">Cancelar</button>
<button type="button" id="confirm-ok" class="h-10 px-4 rounded-full bg-primary text-on-primary font-label-md active:scale-95 transition">Confirmar</button>
</div>
</div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-28 lg:bottom-24 left-1/2 -translate-x-1/2 z-[95] bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full shadow-lg text-body-sm max-w-[90vw] text-center"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/topics.js"></script>
<script src="assets/spa.js"></script>
<script src="assets/views.js"></script>
</body>
</html>

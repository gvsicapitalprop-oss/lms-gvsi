<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title>GVSI Comunidade — Suporte (Atendimento)</title>
<script>(function(){try{var t=localStorage.getItem('gvsi-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-app class="bg-background text-on-background font-body-md min-h-screen">

<!-- Top bar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface shadow-[0px_4px_20px_rgba(0,0,0,0.05)] h-14 flex items-center justify-between px-container-margin">
<a href="index.html" class="flex items-center gap-sm text-primary hover:opacity-80 active:scale-95 transition" aria-label="Voltar à comunidade">
<span class="material-symbols-outlined">arrow_back</span>
<span class="font-headline-sm text-headline-sm font-bold">Suporte · Atendimento</span>
</a>
<div class="flex items-center gap-xs">
<button type="button" data-theme-toggle class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors" aria-label="Alternar tema">
<span class="material-symbols-outlined" data-theme-icon>dark_mode</span>
</button>
<button type="button" data-signout class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-error/10 hover:text-error transition-colors" aria-label="Sair">
<span class="material-symbols-outlined">logout</span>
</button>
</div>
</header>

<div class="pt-14 h-[100dvh] flex">

<!-- Lista de tickets -->
<aside id="list-panel" class="w-full lg:w-[380px] lg:border-r border-outline-variant flex flex-col shrink-0">
<div class="p-sm flex gap-1 border-b border-outline-variant">
<button data-filter="todos" class="flex-1 py-2 rounded-lg text-label-md font-label-md bg-primary text-on-primary transition-colors">Todos</button>
<button data-filter="pendentes" class="flex-1 py-2 rounded-lg text-label-md font-label-md text-on-surface-variant hover:bg-surface-container-high transition-colors">Pendentes</button>
<button data-filter="resolvidos" class="flex-1 py-2 rounded-lg text-label-md font-label-md text-on-surface-variant hover:bg-surface-container-high transition-colors">Resolvidos</button>
</div>
<div id="ticket-list" class="flex-1 overflow-y-auto custom-scrollbar">
<p class="p-lg text-center text-on-surface-variant text-body-sm">Carregando…</p>
</div>
</aside>

<!-- Conversa -->
<section id="convo-panel" class="hidden lg:flex flex-1 flex-col min-w-0">
<div id="convo-empty" class="flex-1 flex flex-col items-center justify-center text-center gap-md p-xl text-on-surface-variant">
<span class="material-symbols-outlined text-[48px]">forum</span>
<p class="text-body-md max-w-xs">Selecione uma conversa para ver o histórico e responder.</p>
</div>
<div id="convo-main" class="hidden flex-1 flex-col min-h-0">
<!-- convo header -->
<div class="h-16 shrink-0 border-b border-outline-variant flex items-center gap-md px-md">
<button id="convo-back" class="lg:hidden text-primary flex items-center" aria-label="Voltar"><span class="material-symbols-outlined">arrow_back</span></button>
<span class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-outline shrink-0"><span class="material-symbols-outlined">person</span></span>
<div class="flex-1 min-w-0">
<h2 id="convo-name" class="font-bold text-on-surface truncate">—</h2>
<p id="convo-protocol" class="text-body-sm text-outline truncate">—</p>
</div>
<button id="btn-resolve" class="bg-primary text-on-primary rounded-full px-4 py-2 text-label-md font-label-md active:scale-95 transition disabled:opacity-60 flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">check_circle</span><span id="btn-resolve-label">Marcar como resolvido</span>
</button>
</div>
<!-- convo messages -->
<div id="convo-scroll" class="flex-1 overflow-y-auto custom-scrollbar p-md">
<div id="convo-messages" class="flex flex-col gap-md max-w-3xl mx-auto w-full"></div>
</div>
<!-- reply -->
<form id="convo-form" class="shrink-0 border-t border-outline-variant p-sm flex items-center gap-sm">
<input id="convo-input" type="text" autocomplete="off" placeholder="Responder…" class="flex-grow bg-surface-container-low border-none rounded-xl px-md py-3 text-body-md focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline">
<button type="submit" class="w-12 h-12 bg-primary text-on-primary rounded-xl flex items-center justify-center shadow active:scale-90 transition shrink-0" aria-label="Enviar"><span class="material-symbols-outlined fill">send</span></button>
</form>
</div>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/topics.js"></script>
<script src="assets/shell.js"></script>
<script>
(async function () {
  var sb = window.sb; if (!sb) return;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function timeStr(iso) { try { var d=new Date(iso); var t=Date.now()-d.getTime(); if(t<86400000) return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); return d.toLocaleDateString('pt-BR'); } catch(e){ return ''; } }
  function statusLabel(s) { return s === 'aberto' ? 'Pendente' : (s === 'resolvido' ? 'Resolvido' : 'Fechado'); }
  function statusClass(s) { return s === 'aberto' ? 'bg-tertiary-container text-on-tertiary-container' : 'bg-secondary-container text-on-secondary-container'; }

  var ures = await sb.auth.getUser(); var user = ures.data.user; if (!user) return;
  var pr = await sb.from('lms_students').select('id,full_name,role').eq('id', user.id).maybeSingle();
  var me = pr.data || { id: user.id, full_name: 'Suporte', role: 'student' };
  if (me.role !== 'admin') { location.replace('index.html'); return; }
  var topicRes = await sb.from('comu_topics').select('id').eq('slug', 'suporte').single();
  var supportTopicId = topicRes.data.id;

  var currentTicket = null, filter = 'todos', seen = Object.create(null), convoChannel = null;

  async function loadTickets() {
    var q = sb.from('comu_support_tickets')
      .select('*, member:lms_students!user_id(full_name,avatar_url,email)')
      .order('last_message_at', { ascending: false });
    if (filter === 'pendentes') q = q.eq('status', 'aberto');
    if (filter === 'resolvidos') q = q.in('status', ['resolvido', 'fechado']);
    var r = await q;
    var list = $('ticket-list'); list.innerHTML = '';
    if (r.error) { list.innerHTML = '<p class="p-md text-error text-body-sm">' + esc(r.error.message) + '</p>'; return; }
    if (!r.data.length) { list.innerHTML = '<p class="p-lg text-center text-on-surface-variant text-body-sm">Nenhuma conversa.</p>'; return; }
    r.data.forEach(function (tk) {
      var m = tk.member || {};
      var el = document.createElement('button');
      el.className = 'w-full text-left flex items-center gap-md p-md hover:bg-surface-container-low transition-colors border-b border-outline-variant/30 ' + (currentTicket && currentTicket.id === tk.id ? 'bg-surface-container-high' : '');
      el.innerHTML =
        '<span class="w-11 h-11 rounded-full bg-surface-container-high flex items-center justify-center text-outline overflow-hidden shrink-0">' +
          (m.avatar_url ? '<img src="' + esc(m.avatar_url) + '" class="w-full h-full object-cover">' : '<span class="material-symbols-outlined">person</span>') + '</span>' +
        '<span class="flex-1 min-w-0">' +
          '<span class="flex items-center justify-between gap-xs"><span class="font-bold text-on-surface truncate">' + esc(m.full_name || 'Membro') + '</span>' +
          '<span class="text-[10px] text-outline shrink-0">' + timeStr(tk.last_message_at) + '</span></span>' +
          '<span class="flex items-center justify-between gap-xs mt-0.5"><span class="text-body-sm text-outline truncate">' + esc(tk.protocol) + '</span>' +
          '<span class="text-[10px] px-2 py-0.5 rounded-full ' + statusClass(tk.status) + '">' + statusLabel(tk.status) + '</span></span>' +
        '</span>';
      el.addEventListener('click', function () { openTicket(tk); });
      list.appendChild(el);
    });
  }

  function addMsg(msg) {
    if (seen[msg.id]) return; seen[msg.id] = true;
    var mine = msg.author_id === me.id;
    var content = '<p class="font-body-md whitespace-pre-wrap break-words ' + (mine ? '' : 'text-on-surface') + '">' + esc(msg.body) + '</p>';
    if (msg.kind === 'image' && msg.media_url) content = '<img src="' + esc(msg.media_url) + '" class="rounded-lg max-w-full">';
    var wrap = document.createElement('div');
    if (mine) {
      wrap.className = 'flex flex-col items-end gap-xs max-w-[80%] self-end';
      wrap.innerHTML = '<div class="message-gradient-outgoing text-on-primary rounded-xl rounded-tr-none p-md shadow">' + content + '</div>';
    } else {
      wrap.className = 'flex flex-col items-start gap-xs max-w-[80%]';
      wrap.innerHTML = '<span class="text-label-md font-label-md text-on-surface-variant ml-sm">' + esc(msg.author_name || 'Membro') + '</span><div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl rounded-tl-none p-md">' + content + '</div>';
    }
    $('convo-messages').appendChild(wrap);
  }
  function scrollConvo() { var s = $('convo-scroll'); s.scrollTop = s.scrollHeight; }

  function updateResolveBtn() {
    var b = $('btn-resolve'), lbl = $('btn-resolve-label');
    if (currentTicket && currentTicket.status === 'aberto') { lbl.textContent = 'Marcar como resolvido'; b.disabled = false; }
    else { lbl.textContent = 'Resolvido'; b.disabled = true; }
  }

  function subscribeConvo(ticketId) {
    if (convoChannel) sb.removeChannel(convoChannel);
    convoChannel = sb.channel('ticket-' + ticketId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comu_messages', filter: 'ticket_id=eq.' + ticketId },
        function (p) { addMsg(p.new); scrollConvo(); })
      .subscribe();
  }

  async function openTicket(tk) {
    currentTicket = tk; seen = Object.create(null);
    $('convo-empty').classList.add('hidden');
    $('convo-main').classList.remove('hidden'); $('convo-main').classList.add('flex');
    // mobile: mostra conversa, esconde lista
    $('list-panel').classList.add('hidden'); $('convo-panel').classList.remove('hidden');
    var m = tk.member || {};
    $('convo-name').textContent = m.full_name || 'Membro';
    $('convo-protocol').textContent = tk.protocol + ' · ' + statusLabel(tk.status);
    updateResolveBtn();
    $('convo-messages').innerHTML = '';
    var r = await sb.from('comu_messages').select('*').eq('ticket_id', tk.id).order('created_at', { ascending: true });
    (r.data || []).forEach(addMsg);
    scrollConvo();
    subscribeConvo(tk.id);
    loadTickets();
  }

  $('convo-back').addEventListener('click', function () {
    $('convo-panel').classList.add('hidden'); $('list-panel').classList.remove('hidden');
  });

  $('convo-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var body = $('convo-input').value.trim(); if (!body || !currentTicket) return;
    $('convo-input').value = '';
    var ins = await sb.from('comu_messages').insert({
      topic_id: supportTopicId, author_id: me.id, ticket_id: currentTicket.id,
      kind: 'text', body: body, author_name: me.full_name || 'Suporte'
    }).select().single();
    if (ins.error) { console.error(ins.error); $('convo-input').value = body; return; }
    addMsg(ins.data); scrollConvo();
  });

  $('btn-resolve').addEventListener('click', async function () {
    if (!currentTicket || currentTicket.status !== 'aberto') return;
    var up = await sb.from('comu_support_tickets').update({ status: 'resolvido', resolved_at: new Date().toISOString() })
      .eq('id', currentTicket.id).select('*, member:lms_students!user_id(full_name,avatar_url,email)').single();
    if (up.error) { console.error(up.error); return; }
    currentTicket = up.data;
    $('convo-protocol').textContent = currentTicket.protocol + ' · ' + statusLabel(currentTicket.status);
    updateResolveBtn(); loadTickets();
  });

  document.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () {
      filter = b.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(function (x) { x.classList.remove('bg-primary', 'text-on-primary'); x.classList.add('text-on-surface-variant'); });
      b.classList.add('bg-primary', 'text-on-primary'); b.classList.remove('text-on-surface-variant');
      loadTickets();
    });
  });

  loadTickets();
  sb.channel('tickets-list').on('postgres_changes', { event: '*', schema: 'public', table: 'comu_support_tickets' }, function () { loadTickets(); }).subscribe();
})();
</script>
</body>
</html>

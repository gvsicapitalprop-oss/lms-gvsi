<style>:root{--fs:1}</style>

<!-- Anti-flash: esconde a tela atrás de um splash até fontes+estilos prontos, e revela tudo de uma vez -->
<style id="gvsi-boot">
html.gvsi-loading{background:#faf8ff}
html.dark.gvsi-loading{background:#121318}
html.gvsi-loading body{visibility:hidden}
#gvsi-splash{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;background:#faf8ff}
html.dark #gvsi-splash{background:#121318}
html.gvsi-loading #gvsi-splash{display:flex;visibility:visible}
#gvsi-splash .r{width:40px;height:40px;border-radius:50%;border:3px solid rgba(13,36,78,.15);border-top-color:#0d244e;animation:gvsi-rot .8s linear infinite}
html.dark #gvsi-splash .r{border-color:rgba(157,184,255,.22);border-top-color:#9db8ff}
@keyframes gvsi-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#gvsi-splash .r{animation:none}}
</style>
<script>(function(){var el=document.documentElement;el.classList.add('gvsi-loading');var done=false;function reveal(){if(done)return;done=true;el.classList.remove('gvsi-loading');}var fp=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();var cp=new Promise(function(res){window.__gvsiContentReady=res;if(document.readyState==='complete')res();else addEventListener('load',res);});Promise.all([fp,cp]).then(reveal);setTimeout(reveal,2500);})();</script>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<div id="gvsi-splash" aria-hidden="true"><span class="r"></span></div>

<div class="absolute top-4 right-4">
<button type="button" data-theme-toggle class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors" aria-label="Alternar tema">
<span class="material-symbols-outlined" data-theme-icon>dark_mode</span>
</button>
</div>

<main class="flex-1 flex items-center justify-center px-container-margin py-xl">
<div class="w-full max-w-sm">

<!-- Brand -->
<div class="flex flex-col items-center gap-sm mb-xl">
<img src="assets/logo-light.svg?v=2" alt="GVSI Capital Prop" class="h-24 w-auto mx-auto dark:hidden">
<img src="assets/logo-dark.svg?v=4" alt="GVSI Comunidade" class="h-24 w-auto mx-auto hidden dark:block brightness-0 invert">
<p class="text-body-sm text-on-surface-variant text-center text-balance">Entre para acessar a comunidade</p>
</div>

<!-- Card -->
<div class="bg-surface-container-lowest border border-outline-variant/40 rounded-2xl shadow-sm p-lg space-y-md">

<form id="auth-form" class="space-y-md">
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-xs" for="email">E-mail</label>
<input id="email" type="email" required autocomplete="email" class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 px-4 focus:ring-2 focus:ring-primary focus:border-primary transition-all text-body-md text-on-surface" placeholder="voce@email.com">
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-xs" for="password">Senha</label>
<input id="password" type="password" autocomplete="current-password" class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3 px-4 focus:ring-2 focus:ring-primary focus:border-primary transition-all text-body-md text-on-surface" placeholder="No primeiro acesso, deixe em branco">
</div>
<button id="submit-btn" type="submit" class="w-full h-12 bg-primary text-on-primary rounded-xl font-headline-sm text-headline-sm flex items-center justify-center gap-sm shadow-md active:scale-[0.98] transition-all disabled:opacity-60">
<span id="submit-label">Entrar</span>
</button>
</form>

<div class="flex items-start gap-sm bg-primary/5 border border-primary/20 rounded-xl px-3 py-2 text-body-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px] text-primary shrink-0">tips_and_updates</span>
<span class="text-balance"><b>Primeiro acesso?</b> Digite seu e-mail, <b>deixe a senha em branco</b> e toque em <b>Entrar</b>. Você cria a sua senha na próxima tela.</span>
</div>

<p id="msg" class="hidden text-body-sm text-center"></p>

</div>
<p class="text-center text-body-sm text-on-surface-variant mt-lg text-balance">Acesso exclusivo para membros da comunidade GVSI.</p>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/auth.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var sb = window.sb;

  function showMsg(text, ok) {
    var m = $('msg');
    m.textContent = text;
    m.className = 'text-body-sm text-center ' + (ok ? 'text-primary' : 'text-error');
    m.classList.remove('hidden');
  }

  // Já logado? vai direto pro app.
  if (sb) {
    sb.auth.getSession().then(function (r) { if (r.data.session) location.replace('/'); });
  } else {
    showMsg('Falha ao conectar no servidor. Recarregue a página.', false);
  }

  // Senha temporária interna do 1º acesso (a pessoa nunca vê nem digita).
  // No pré-cadastro cada conta nasce com esta senha; ao criar a senha própria, ela é substituída.
  var FIRST_ACCESS = 'gvsi!acesso-inicial#2026';

  $('auth-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!sb) return;
    var email = $('email').value.trim().toLowerCase();
    var password = $('password').value;
    if (!email) { showMsg('Digite o seu e-mail.', false); return; }
    $('submit-btn').disabled = true;
    showMsg('Aguarde...', true);
    try {
      // sem senha digitada => tenta o 1º acesso; com senha => usa a senha da pessoa.
      var r = await sb.auth.signInWithPassword({ email: email, password: password || FIRST_ACCESS });
      // digitou uma senha que não bateu? tenta ainda o 1º acesso (pode ser primeiro acesso).
      if (r.error && password) { r = await sb.auth.signInWithPassword({ email: email, password: FIRST_ACCESS }); }
      if (r.error) {
        if (password) { showMsg('E-mail ou senha incorretos.', false); }
        else { showMsg('Não encontramos esse e-mail (ou a conta já tem senha). Se você já criou a sua senha, digite ela no campo acima.', false); $('password').focus(); }
        return;
      }
      await window.GVSIAuth.ensureProfile();
      location.replace('/'); // no app, se for 1º acesso, abre a tela de criar senha
    } catch (err) {
      showMsg(err && err.message ? err.message : 'Não foi possível entrar. Verifique seus dados.', false);
    } finally {
      $('submit-btn').disabled = false;
    }
  });
</script>
<!-- Toggle de tema (login não carrega o spa.js, então replicamos aqui) -->
<script>
(function () {
  var root = document.documentElement;
  function updateIcons() {
    var dark = root.classList.contains('dark');
    document.querySelectorAll('[data-theme-icon]').forEach(function (el) { el.textContent = dark ? 'light_mode' : 'dark_mode'; });
  }
  updateIcons(); // sincroniza o ícone com o tema atual (dark vindo do localStorage)
  document.addEventListener('click', function (e) {
    var tt = e.target.closest && e.target.closest('[data-theme-toggle]');
    if (!tt) return;
    var next = root.classList.contains('dark') ? 'light' : 'dark';
    var apply = function () { root.classList.toggle('dark', next === 'dark'); try { localStorage.setItem('gvsi-theme', next); } catch (er) {} updateIcons(); };
    var reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (x) {}
    if (document.startViewTransition && !reduce) {
      var cx = e.clientX || (window.innerWidth - 40), cy = e.clientY || 40;
      var endR = Math.hypot(Math.max(cx, window.innerWidth - cx), Math.max(cy, window.innerHeight - cy));
      document.startViewTransition(apply).ready.then(function () {
        root.animate(
          { clipPath: ['circle(0px at ' + cx + 'px ' + cy + 'px)', 'circle(' + endR + 'px at ' + cx + 'px ' + cy + 'px)'] },
          { duration: 480, easing: 'ease-in-out', pseudoElement: '::view-transition-new(root)' }
        );
      }).catch(function () {});
    } else {
      root.classList.add('theme-anim'); apply(); setTimeout(function () { root.classList.remove('theme-anim'); }, 420);
    }
  });
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>

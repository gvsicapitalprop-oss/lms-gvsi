<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<base href="/">
<title>GVSI Comunidade</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d244e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GVSI">
<script>(function(){try{var t=localStorage.getItem('gvsi-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();</script>
<style>:root{--side-w:360px;--fs:1}</style>
<script>(function(){try{var d=document.documentElement;var w=parseInt(localStorage.getItem('gvsi-side-w'),10);if(w>=260&&w<=560)d.style.setProperty('--side-w',w+'px');var f=parseFloat(localStorage.getItem('gvsi-fs'));if(f>=0.9&&f<=1.3)d.style.setProperty('--fs',f);}catch(e){}})();</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/tailwind-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="bg-background text-on-background font-body-md min-h-screen">

<!-- Sidebar (desktop) — persiste em toda navegação -->
<aside class="hidden lg:flex lg:flex-col fixed inset-y-0 left-0 w-[var(--side-w)] bg-surface border-r border-outline-variant z-40">
<a href="/" class="flex items-center px-lg py-5 border-b border-outline-variant shrink-0 bg-surface-container-low">
<img src="assets/logo-light.svg?v=2" alt="GVSI Capital Prop" class="h-12 w-auto dark:hidden">
<img src="assets/logo-dark.svg?v=4" alt="GVSI Comunidade" class="h-12 w-auto hidden dark:block brightness-0 invert">
</a>
<nav id="side-topics" class="flex-1 overflow-y-auto custom-scrollbar p-sm space-y-1"></nav>
<div class="border-t border-outline-variant p-sm flex items-center gap-sm shrink-0">
<a href="/perfil" data-side-profile class="flex-1 flex items-center gap-sm p-sm rounded-lg hover:bg-surface-container-high transition-colors">
<span data-side-avatar class="w-11 h-11 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant overflow-hidden"><span class="material-symbols-outlined text-[24px]">person</span></span>
<span data-side-name class="text-body-md text-on-surface truncate">Meu Perfil</span>
</a>
<button type="button" data-theme-toggle class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors" aria-label="Alternar tema">
<span class="material-symbols-outlined text-[24px]" data-theme-icon>dark_mode</span>
</button>
<button type="button" data-signout class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-error/10 hover:text-error transition-colors" aria-label="Sair">
<span class="material-symbols-outlined text-[24px]">logout</span>
</button>
</div>
<div id="side-resizer" role="separator" aria-orientation="vertical" aria-label="Redimensionar largura da lista" title="Arraste para redimensionar" class="absolute top-0 right-0 h-full w-2 cursor-col-resize z-50 group flex items-stretch justify-end">
<span class="w-1 bg-outline-variant/40 group-hover:bg-primary/70 transition-colors"></span>
</div>
</aside>

<!-- Região de conteúdo — trocada pelo roteador (sem recarregar) -->
<div id="view" class="min-h-screen"></div>

<!-- Modal de confirmação -->
<div id="confirm-modal" class="hidden fixed inset-0 z-[90] items-center justify-center p-container-margin bg-black/40">
<div class="w-full max-w-xs bg-surface-container-lowest rounded-2xl shadow-xl border border-outline-variant/40 p-lg space-y-md">
<h3 id="confirm-title" class="font-headline-sm text-headline-sm text-on-surface">Confirmar?</h3>
<p id="confirm-text" class="text-body-sm text-on-surface-variant"></p>
<div class="flex gap-sm justify-end pt-sm">
<button type="button" id="confirm-cancel" class="h-10 px-4 rounded-full text-on-surface font-label-md hover:bg-surface-container-high transition">Cancelar</button>
<button type="button" id="confirm-ok" class="h-10 px-4 rounded-full bg-primary text-on-primary font-label-md active:scale-95 transition">Confirmar</button>
</div>
</div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-28 lg:bottom-24 left-1/2 -translate-x-1/2 z-[95] bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full shadow-lg text-body-sm max-w-[90vw] text-center"></div>

<!-- Botão flutuante: rever o tour de boas-vindas -->
<button type="button" id="onb-fab" class="hidden fixed bottom-24 lg:bottom-6 right-4 lg:right-6 z-[70] items-center gap-xs h-12 px-4 rounded-full bg-surface-container-highest text-on-surface border border-outline-variant/50 shadow-lg hover:bg-surface-container-high active:scale-95 transition" aria-label="Ver o tutorial de boas-vindas" title="Ver o tutorial de boas-vindas">
<span class="material-symbols-outlined text-[22px]">help</span>
<span class="font-label-md text-label-md">Tutorial</span>
</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase.js"></script>
<script src="assets/topics.js"></script>
<script src="assets/spa.js?v=22"></script>
<script src="assets/views.js?v=20"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
</html>
